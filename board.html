<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Trello | Board</title>
  <link rel="stylesheet" href="board.css" />
</head>
<body>
  <div class="board-shell">
    <header class="board-header">
      <div>
        <p class="eyebrow">Live task workspace</p>
        <h1>Board</h1>
      </div>
      <nav>
        <a href="index.html">Home</a>
        <a href="card-details.html">Card Details</a>
      </nav>
    </header>

    <section class="board-actions">
      <div class="stats-panel">
        <div>
          <span>Total Lists</span>
          <strong id="listCount">3</strong>
        </div>
        <div>
          <span>Total Cards</span>
          <strong id="cardCount">0</strong>
        </div>
      </div>

      <form id="addListForm" class="new-list-form">
        <input type="text" name="title" placeholder="Create a new list" aria-label="New list title" required />
        <button type="submit">+ Add List</button>
      </form>
    </section>

    <main class="board" id="board">
      <section class="list" data-list="backlog">
        <div class="list-header">
          <div>
            <h2>Backlog</h2>
            <p class="list-meta">0 cards</p>
          </div>
          <span class="pill pill-quiet">Ideas</span>
        </div>

        <div class="cards" aria-label="Backlog cards"></div>

        <form class="card-form">
          <textarea placeholder="New task title" rows="2" required></textarea>
          <button type="button" class="add-card-button">Add task</button>
        </form>
      </section>

      <section class="list" data-list="in-progress">
        <div class="list-header">
          <div>
            <h2>In Progress</h2>
            <p class="list-meta">0 cards</p>
          </div>
          <span class="pill pill-quiet">Active</span>
        </div>

        <div class="cards" aria-label="In Progress cards"></div>

        <form class="card-form">
          <textarea placeholder="New task title" rows="2" required></textarea>
          <button type="button" class="add-card-button">Add task</button>
        </form>
      </section>

      <section class="list" data-list="done">
        <div class="list-header">
          <div>
            <h2>Done</h2>
            <p class="list-meta">0 cards</p>
          </div>
          <span class="pill pill-quiet">Complete</span>
        </div>

        <div class="cards" aria-label="Done cards"></div>

        <form class="card-form">
          <textarea placeholder="New task title" rows="2" required></textarea>
          <button type="button" class="add-card-button">Add task</button>
        </form>
      </section>
    </main>
  </div>

  <script src="drag-and-drop.js"></script>
</body>
</html>
